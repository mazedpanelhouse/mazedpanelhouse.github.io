<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reseller Dashboard - Mazed Panel House</title>
  <style>
    body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
    .card { max-width: 720px; margin: 20px auto; background: #1e293b; padding: 20px; border-radius: 12px; }
    input, button { padding: 10px; border-radius: 8px; border: none; margin-top: 8px; }
    input { width: 100%; box-sizing: border-box; }
    button { background: #2563eb; color: #fff; font-weight: bold; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; margin-top: 14px; }
    th, td { border: 1px solid #334155; padding: 8px; text-align: left; }
  </style>
</head>
<body>
  <div class="card">
    <h2>রিসেলার ড্যাশবোর্ড</h2>
    <input type="text" id="myCodeInput" placeholder="আপনার রিসেলার কোড লিখুন (যেমন: rahim01)" />
    <button onclick="checkReseller()">ড্যাশবোর্ড দেখুন</button>

    <div id="dashboardArea" style="display:none; margin-top:16px;">
      <p><strong>আপনার রেফারেল লিংক:</strong></p>
      <input type="text" id="myRefLink" readonly onclick="this.select()" />
      <p><strong>মোট রেফারেল অর্ডার:</strong> <span id="myOrderCount">0</span></p>

      <table>
        <thead>
          <tr>
            <th>অর্ডার আইডি</th>
            <th>প্যানেল</th>
            <th>স্ট্যাটাস</th>
          </tr>
        </thead>
        <tbody id="myOrdersBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    function checkReseller() {
      const code = document.getElementById("myCodeInput").value.trim().toLowerCase();
      if (!code) return;

      const resellers = JSON.parse(localStorage.getItem("mazed_resellers") || "[]");
      const orders = JSON.parse(localStorage.getItem("mazed_orders") || "[]");
      const found = resellers.find(r => r.code === code);

      const baseUrl = found ? found.baseUrl : (window.location.origin + "/index.html");
      const refLink = baseUrl + (baseUrl.includes("?") ? "&" : "?") + "ref=" + encodeURIComponent(code);

      const myOrders = orders.filter(o => o.resellerCode.toLowerCase() === code);

      document.getElementById("dashboardArea").style.display = "block";
      document.getElementById("myRefLink").value = refLink;
      document.getElementById("myOrderCount").textContent = myOrders.length;

      const tbody = document.getElementById("myOrdersBody");
      tbody.innerHTML = "";
      myOrders.forEach(o => {
        tbody.innerHTML += `<tr><td>${o.id}</td><td>${o.panel}</td><td>${o.status}</td></tr>`;
      });
    }
  </script>
</body>
</html>
