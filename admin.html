<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel | Mazed Panel House</title>
  <style>
    :root {
      --bg: #0f1115;
      --card: #171a21;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --accent: #10b981;
      --border: #262b36;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); }
    header {
      padding: 16px 24px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .container { max-width: 860px; margin: 28px auto; padding: 0 16px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    input, button {
      width: 100%;
      padding: 10px 12px;
      margin-top: 8px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 0.95rem;
    }
    input { background: var(--bg); color: var(--text); }
    button {
      background: var(--accent);
      color: #06281e;
      font-weight: 700;
      border: none;
      cursor: pointer;
    }
    button.secondary { background: #272c38; color: var(--text); }
    button.danger { background: var(--danger); color: #fff; width: auto; padding: 6px 12px; margin: 0; }
    .row { display: grid; grid-template-columns: 1fr 1.6fr auto; gap: 8px; align-items: center; margin-bottom: 8px; }
    .panel-row { display: grid; grid-template-columns: 1.2fr 0.7fr 1.5fr auto; gap: 8px; align-items: center; margin-bottom: 8px; }
    .banner-row { display: grid; grid-template-columns: 1fr 1.2fr 1.2fr auto; gap: 8px; align-items: center; margin-bottom: 8px; }
    .admin-row { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; align-items: center; margin-bottom: 8px; }
    .status { color: #34d399; margin-top: 10px; font-size: 0.9rem; }
    .error { color: #f87171; margin-top: 8px; font-size: 0.9rem; }
    .hidden { display: none; }
    ul { padding-left: 18px; color: var(--muted); }
    .toggle-row { display: flex; align-items: center; gap: 10px; margin: 12px 0; }
    .toggle-row input[type="checkbox"] { width: auto; margin: 0; transform: scale(1.2); }
    .time-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  </style>
</head>
<body>
  <header>
    <div>Mazed Panel House — Admin Control</div>
    <button id="adminLogoutBtn" class="secondary hidden" style="width:auto;margin:0;padding:7px 14px;">Lock Admin</button>
  </header>

  <div class="container">
    <!-- Admin Login Gate -->
    <div id="adminLoginCard" class="card" style="max-width:440px;margin:40px auto;">
      <h2 style="margin-top:0;">Admin Login</h2>
      <form id="adminLoginForm">
        <input type="text" id="adminUserInput" placeholder="Admin Username" required />
        <input type="password" id="adminPassInput" placeholder="Admin Password" required />
        <button type="submit">Unlock Admin Panel</button>
      </form>
      <div id="adminLoginErr" class="error"></div>
    </div>

    <!-- Protected Admin Workspace -->
    <div id="adminDashboard" class="hidden">
      <div class="card">
        <h2 style="margin-top:0;">Popup & Telegram Channels Manager</h2>

        <label for="popupMsgInput" style="font-size:0.9rem;color:var(--muted);">Popup Message Text</label>
        <input type="text" id="popupMsgInput" placeholder="Stay joined to our Telegram channels for all panel updates." />

        <div class="toggle-row">
          <input type="checkbox" id="showChannelsToggle" checked />
          <label for="showChannelsToggle">Show Telegram Channels inside Popup</label>
        </div>

        <div id="channelRows"></div>

        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;">
          <button type="button" id="addChannelBtn" class="secondary" style="width:auto;">+ Add Channel</button>
          <button type="button" id="saveConfigBtn" style="width:auto;">Save Settings</button>
        </div>

        <div id="saveStatus" class="status"></div>
      </div>

      <div class="card">
        <h2 style="margin-top:0;">Store Hours & Payment Control</h2>

        <div class="toggle-row">
          <input type="checkbox" id="hoursEnabledToggle" />
          <label for="hoursEnabledToggle">Enable Opening & Closing Hours</label>
        </div>

        <div class="time-grid">
          <div>
            <label for="openTimeInput" style="font-size:0.85rem;color:var(--muted);">Opening Time</label>
            <input type="time" id="openTimeInput" value="09:00" />
          </div>
          <div>
            <label for="closeTimeInput" style="font-size:0.85rem;color:var(--muted);">Closing Time</label>
            <input type="time" id="closeTimeInput" value="23:59" />
          </div>
        </div>

        <input type="text" id="closedMsgInput" placeholder="Closed notice message" />

        <div class="toggle-row">
          <input type="checkbox" id="paymentEnabledToggle" checked />
          <label for="paymentEnabledToggle">Enable Payment & Auto-Match Check</label>
        </div>

        <div id="paymentRows"></div>
        <button type="button" id="addPaymentBtn" class="secondary" style="width:auto;">+ Add Payment Method</button>

        <hr style="border:0;border-top:1px solid var(--border);margin:18px 0;" />

        <h3 style="margin-top:0;">Panels Manager</h3>
        <div id="panelRows"></div>
        <button type="button" id="addPanelBtn" class="secondary" style="width:auto;">+ Add Panel</button>

        <hr style="border:0;border-top:1px solid var(--border);margin:18px 0;" />

        <h3 style="margin-top:0;">Banner Slider Manager (Unlimited)</h3>
        <div id="bannerRows"></div>
        <button type="button" id="addBannerBtn" class="secondary" style="width:auto;">+ Add Banner</button>

        <div style="margin-top:14px;">
          <button type="button" id="saveStoreBtn" style="width:auto;">Save Store & Panels</button>
        </div>
        <div id="storeSaveStatus" class="status"></div>
      </div>

      <div class="card">
        <h2 style="margin-top:0;">Multi-Admin Manager</h2>
        <div id="adminRows"></div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;">
          <button type="button" id="addAdminBtn" class="secondary" style="width:auto;">+ Add Admin</button>
          <button type="button" id="saveAdminsBtn" style="width:auto;">Save Admins</button>
        </div>
        <div id="adminSaveStatus" class="status"></div>
      </div>

      <div class="card">
        <h3 style="margin-top:0;">Registered Users (Local Browser Data)</h3>
        <ul id="userList"></ul>
      </div>
    </div>
  </div>

  <script>
    const DB_TG_CFG_KEY = 'mph_tg_config_v1';
    const DB_USERS_KEY = 'mph_users_v1';
    const DB_ADMIN_AUTH_KEY = 'mph_admin_unlocked_v1';
    const DB_STORE_CFG_KEY = 'mph_store_config_v1';
    const DB_ADMINS_KEY = 'mph_admins_v1';

    const DEFAULT_ADMINS = [{ username: 'admin', password: 'admin123' }];

    function getAdmins() {
      const raw = JSON.parse(localStorage.getItem(DB_ADMINS_KEY) || 'null');
      if (Array.isArray(raw) && raw.length) return raw;
      return DEFAULT_ADMINS;
    }

    function setAdminUnlocked(unlocked) {
      if (unlocked) {
        sessionStorage.setItem(DB_ADMIN_AUTH_KEY, '1');
        document.getElementById('adminLoginCard').classList.add('hidden');
        document.getElementById('adminDashboard').classList.remove('hidden');
        document.getElementById('adminLogoutBtn').classList.remove('hidden');
        loadConfigIntoForm();
        loadStoreIntoForm();
        loadAdminsIntoForm();
        renderUsers();
      } else {
        sessionStorage.removeItem(DB_ADMIN_AUTH_KEY);
        document.getElementById('adminLoginCard').classList.remove('hidden');
        document.getElementById('adminDashboard').classList.add('hidden');
        document.getElementById('adminLogoutBtn').classList.add('hidden');
      }
    }

    document.getElementById('adminLoginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const u = document.getElementById('adminUserInput').value.trim();
      const p = document.getElementById('adminPassInput').value;
      const found = getAdmins().some((a) => a.username === u && a.password === p);
      if (found) {
        document.getElementById('adminLoginErr').textContent = '';
        setAdminUnlocked(true);
      } else {
        document.getElementById('adminLoginErr').textContent = 'Invalid admin credentials.';
      }
    });

    document.getElementById('adminLogoutBtn').addEventListener('click', () => {
      setAdminUnlocked(false);
    });

    function escAttr(v) {
      return String(v || '').replace(/"/g, '&quot;');
    }

    function createChannelRow(label = '', url = '') {
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = `
        <input type="text" class="ch-label" placeholder="Channel Name" value="${escAttr(label)}" />
        <input type="url" class="ch-url" placeholder="https://t.me/channel_name" value="${escAttr(url)}" />
        <button type="button" class="danger remove-ch-btn">Remove</button>
      `;
      row.querySelector('.remove-ch-btn').addEventListener('click', () => row.remove());
      document.getElementById('channelRows').appendChild(row);
    }

    function loadConfigIntoForm() {
      const raw = JSON.parse(localStorage.getItem(DB_TG_CFG_KEY) || 'null');
      const cfg = raw && typeof raw === 'object' ? raw : {
        showChannels: true,
        popupMessage: 'Stay joined to our Telegram channels for all panel updates.',
        channels: [{ label: 'Main Channel', url: '' }]
      };

      document.getElementById('popupMsgInput').value = cfg.popupMessage || 'Stay joined to our Telegram channels for all panel updates.';
      document.getElementById('showChannelsToggle').checked = cfg.showChannels !== false;

      const rowsContainer = document.getElementById('channelRows');
      rowsContainer.innerHTML = '';
      const channels = Array.isArray(cfg.channels) && cfg.channels.length ? cfg.channels : [{ label: '', url: '' }];
      channels.forEach((ch) => createChannelRow(ch.label || '', ch.url || ''));
    }

    document.getElementById('addChannelBtn').addEventListener('click', () => createChannelRow('', ''));

    document.getElementById('saveConfigBtn').addEventListener('click', () => {
      const popupMessage = document.getElementById('popupMsgInput').value.trim() || 'Stay joined to our Telegram channels for all panel updates.';
      const showChannels = document.getElementById('showChannelsToggle').checked;
      const rows = Array.from(document.querySelectorAll('#channelRows .row'));

      const channels = rows
        .map((row, idx) => {
          const label = row.querySelector('.ch-label').value.trim();
          const url = row.querySelector('.ch-url').value.trim();
          return url ? { label: label || `Telegram Channel ${idx + 1}`, url } : null;
        })
        .filter(Boolean);

      localStorage.setItem(DB_TG_CFG_KEY, JSON.stringify({
        popupMessage,
        showChannels,
        channels
      }));

      document.getElementById('saveStatus').textContent = `Saved (${channels.length} channel(s), Show Channels: ${showChannels ? 'ON' : 'OFF'}).`;
    });

    function createPaymentRow(method = '', account = '', note = '') {
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = `
        <input type="text" class="pm-method" placeholder="Method (e.g. bKash)" value="${escAttr(method)}" />
        <input type="text" class="pm-account" placeholder="Number / Address" value="${escAttr(account)}" />
        <button type="button" class="danger remove-pm-btn">Remove</button>
      `;
      row.dataset.note = note || '';
      row.querySelector('.remove-pm-btn').addEventListener('click', () => row.remove());
      document.getElementById('paymentRows').appendChild(row);
    }

    function createPanelRow(name = '', price = 10, desc = '') {
      const row = document.createElement('div');
      row.className = 'panel-row';
      row.innerHTML = `
        <input type="text" class="pn-name" placeholder="Panel Name" value="${escAttr(name)}" />
        <input type="number" step="any" class="pn-price" placeholder="Price" value="${escAttr(price)}" />
        <input type="text" class="pn-desc" placeholder="Short description" value="${escAttr(desc)}" />
        <button type="button" class="danger remove-pn-btn">Remove</button>
      `;
      row.querySelector('.remove-pn-btn').addEventListener('click', () => row.remove());
      document.getElementById('panelRows').appendChild(row);
    }

    function createBannerRow(title = '', subtitle = '', image = '') {
      const row = document.createElement('div');
      row.className = 'banner-row';
      row.innerHTML = `
        <input type="text" class="bn-title" placeholder="Banner Title" value="${escAttr(title)}" />
        <input type="text" class="bn-sub" placeholder="Banner Subtitle" value="${escAttr(subtitle)}" />
        <input type="text" class="bn-img" placeholder="Image URL (optional)" value="${escAttr(image)}" />
        <button type="button" class="danger remove-bn-btn">Remove</button>
      `;
      row.querySelector('.remove-bn-btn').addEventListener('click', () => row.remove());
      document.getElementById('bannerRows').appendChild(row);
    }

    function loadStoreIntoForm() {
      const raw = JSON.parse(localStorage.getItem(DB_STORE_CFG_KEY) || 'null') || {};
      document.getElementById('hoursEnabledToggle').checked = Boolean(raw.hoursEnabled);
      document.getElementById('openTimeInput').value = raw.openTime || '09:00';
      document.getElementById('closeTimeInput').value = raw.closeTime || '23:59';
      document.getElementById('closedMsgInput').value = raw.closedMessage || 'Store is currently closed. Please check back during opening hours.';
      document.getElementById('paymentEnabledToggle').checked = raw.paymentEnabled !== false;

      const pmBox = document.getElementById('paymentRows');
      pmBox.innerHTML = '';
      const pms = Array.isArray(raw.payments) && raw.payments.length
        ? raw.payments
        : [{ method: 'bKash', account: '01700000000', note: 'Send Money / Payment' }];
      pms.forEach((p) => createPaymentRow(p.method, p.account, p.note));

      const pnBox = document.getElementById('panelRows');
      pnBox.innerHTML = '';
      const panels = Array.isArray(raw.panels) && raw.panels.length
        ? raw.panels
        : [
            { name: 'Starter Panel', price: 10, desc: 'Quick setup and core features.' },
            { name: 'Pro Panel', price: 25, desc: 'Full features and priority updates.' }
          ];
      panels.forEach((p) => createPanelRow(p.name, p.price, p.desc));

      const bnBox = document.getElementById('bannerRows');
      bnBox.innerHTML = '';
      const banners = Array.isArray(raw.banners) && raw.banners.length
        ? raw.banners
        : [{ title: 'Mazed Panel House', subtitle: 'Clean panel access with instant updates.', image: '' }];
      banners.forEach((b) => createBannerRow(b.title, b.subtitle, b.image));
    }

    document.getElementById('addPaymentBtn').addEventListener('click', () => createPaymentRow('', '', ''));
    document.getElementById('addPanelBtn').addEventListener('click', () => createPanelRow('', 10, ''));
    document.getElementById('addBannerBtn').addEventListener('click', () => createBannerRow('', '', ''));

    document.getElementById('saveStoreBtn').addEventListener('click', () => {
      const hoursEnabled = document.getElementById('hoursEnabledToggle').checked;
      const openTime = document.getElementById('openTimeInput').value || '09:00';
      const closeTime = document.getElementById('closeTimeInput').value || '23:59';
      const closedMessage = document.getElementById('closedMsgInput').value.trim() || 'Store is currently closed.';
      const paymentEnabled = document.getElementById('paymentEnabledToggle').checked;

      const payments = Array.from(document.querySelectorAll('#paymentRows .row'))
        .map((r) => ({
          method: r.querySelector('.pm-method').value.trim(),
          account: r.querySelector('.pm-account').value.trim(),
          note: r.dataset.note || ''
        }))
        .filter((x) => x.method && x.account);

      const panels = Array.from(document.querySelectorAll('#panelRows .panel-row'))
        .map((r) => ({
          name: r.querySelector('.pn-name').value.trim(),
          price: Number(r.querySelector('.pn-price').value || 0),
          desc: r.querySelector('.pn-desc').value.trim()
        }))
        .filter((x) => x.name);

      const banners = Array.from(document.querySelectorAll('#bannerRows .banner-row'))
        .map((r) => ({
          title: r.querySelector('.bn-title').value.trim(),
          subtitle: r.querySelector('.bn-sub').value.trim(),
          image: r.querySelector('.bn-img').value.trim()
        }))
        .filter((x) => x.title || x.subtitle || x.image);

      localStorage.setItem(DB_STORE_CFG_KEY, JSON.stringify({
        hoursEnabled,
        openTime,
        closeTime,
        closedMessage,
        paymentEnabled,
        payments,
        panels,
        banners
      }));

      document.getElementById('storeSaveStatus').textContent = `Saved (${panels.length} panel(s), ${banners.length} banner(s), ${payments.length} payment method(s)).`;
    });

    function createAdminRow(username = '', password = '') {
      const row = document.createElement('div');
      row.className = 'admin-row';
      row.innerHTML = `
        <input type="text" class="ad-user" placeholder="Admin Username" value="${escAttr(username)}" />
        <input type="text" class="ad-pass" placeholder="Admin Password" value="${escAttr(password)}" />
        <button type="button" class="danger remove-ad-btn">Remove</button>
      `;
      row.querySelector('.remove-ad-btn').addEventListener('click', () => {
        if (document.querySelectorAll('#adminRows .admin-row').length <= 1) return;
        row.remove();
      });
      document.getElementById('adminRows').appendChild(row);
    }

    function loadAdminsIntoForm() {
      const box = document.getElementById('adminRows');
      box.innerHTML = '';
      getAdmins().forEach((a) => createAdminRow(a.username, a.password));
    }

    document.getElementById('addAdminBtn').addEventListener('click', () => createAdminRow('', ''));

    document.getElementById('saveAdminsBtn').addEventListener('click', () => {
      const list = Array.from(document.querySelectorAll('#adminRows .admin-row'))
        .map((r) => ({
          username: r.querySelector('.ad-user').value.trim(),
          password: r.querySelector('.ad-pass').value
        }))
        .filter((x) => x.username && x.password);

      if (!list.length) {
        document.getElementById('adminSaveStatus').textContent = 'At least one admin account is required.';
        return;
      }

      localStorage.setItem(DB_ADMINS_KEY, JSON.stringify(list));
      document.getElementById('adminSaveStatus').textContent = `Saved (${list.length} admin account(s)).`;
    });

    function renderUsers() {
      const users = JSON.parse(localStorage.getItem(DB_USERS_KEY) || '{}');
      const emails = Object.keys(users);
      const listEl = document.getElementById('userList');
      listEl.innerHTML = emails.length
        ? emails.map((em) => `<li>${em}</li>`).join('')
        : '<li>No registered users found.</li>';
    }

    if (sessionStorage.getItem(DB_ADMIN_AUTH_KEY) === '1') {
      setAdminUnlocked(true);
    }
  </script>
</body>
</html>
