<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mazed Panel House — Admin Live Users</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #0b1120;
      color: #f8fafc;
      padding: 24px;
    }
    .container { max-width: 980px; margin: 0 auto; }
    h1 { margin: 0 0 6px; font-size: 24px; }
    .sub { margin: 0 0 20px; color: #94a3b8; font-size: 13.5px; }
    .table-wrap {
      overflow-x: auto;
      background: #111827;
      border: 1px solid rgba(148, 163, 184, 0.16);
      border-radius: 14px;
    }
    table { width: 100%; border-collapse: collapse; }
    th, td {
      padding: 12px 14px;
      text-align: left;
      border-bottom: 1px solid rgba(148, 163, 184, 0.12);
      font-size: 13.5px;
    }
    th { background: #0f172a; color: #cbd5e1; font-weight: 600; }
    .user-box { display: flex; align-items: center; gap: 10px; }
    .user-box img {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
      background: #1e293b;
    }
    .badge {
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 11.5px;
      background: rgba(59, 130, 246, 0.18);
      color: #93c5fd;
    }
    .action-btn {
      padding: 6px 11px;
      border-radius: 8px;
      border: 1px solid rgba(148, 163, 184, 0.25);
      background: #090e1a;
      color: #f8fafc;
      font-size: 12px;
      cursor: pointer;
    }
    .action-btn:hover { background: #1e293b; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Mazed Panel House — Admin</h1>
    <p class="sub"><code>mazed_users_live</code> কালেকশনের লাইভ ইউজার ও প্রোফাইল তালিকা</p>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>ইউজার</th>
            <th>ইমেইল</th>
            <th>প্রোভাইডার</th>
            <th>স্ট্যাটাস</th>
            <th>অ্যাকশন</th>
          </tr>
        </thead>
        <tbody id="liveUsersBody">
          <tr><td colspan="5">লোড হচ্ছে...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getFirestore,
      collection,
      onSnapshot,
      doc,
      updateDoc,
      query,
      orderBy
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "mazed-panel-store.firebaseapp.com",
      projectId: "mazed-panel-store",
      storageBucket: "mazed-panel-store.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const tbody = document.getElementById("liveUsersBody");

    const q = query(collection(db, "mazed_users_live"), orderBy("lastLoginAt", "desc"));

    onSnapshot(q, (snap) => {
      if (snap.empty) {
        tbody.innerHTML = '<tr><td colspan="5">এখনো কোনো লাইভ ইউজার নেই।</td></tr>';
        return;
      }

      tbody.innerHTML = "";
      snap.forEach((docSnap) => {
        const u = docSnap.data();
        const nextStatus = u.status === "blocked" ? "active" : "blocked";
        const tr = document.createElement("tr");

        tr.innerHTML = `
          <td>
            <div class="user-box">
              <img src="${u.photoURL || "https://ui-avatars.com/api/?name=User"}" alt="" />
              <span>${u.name || "Unnamed"}</span>
            </div>
          </td>
          <td>${u.email || "-"}</td>
          <td><span class="badge">${u.provider || "account"}</span></td>
          <td>${u.status || "active"}</td>
          <td>
            <button class="action-btn" data-uid="${docSnap.id}" data-next="${nextStatus}">
              ${nextStatus === "blocked" ? "Block" : "Unblock"}
            </button>
          </td>
        `;

        tr.querySelector("button").addEventListener("click", async (e) => {
          const uid = e.target.getAttribute("data-uid");
          const status = e.target.getAttribute("data-next");
          await updateDoc(doc(db, "mazed_users_live", uid), { status });
        });

        tbody.appendChild(tr);
      });
    });
  </script>
</body>
</html>
