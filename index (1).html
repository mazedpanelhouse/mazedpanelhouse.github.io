<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mazed Panel House - প্যানেল স্টোর</title>
  <style>
    body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
    .card { max-width: 520px; margin: 30px auto; background: #1e293b; padding: 24px; border-radius: 12px; }
    input, select, button { width: 100%; padding: 10px; margin-top: 10px; border-radius: 8px; border: none; box-sizing: border-box; }
    button { background: #2563eb; color: #fff; font-weight: bold; cursor: pointer; }
    .badge { display: inline-block; background: #0f766e; padding: 6px 10px; border-radius: 6px; font-size: 13px; margin-bottom: 10px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>মাজেদ প্যানেল হাউস</h2>
    <div id="refStatus" class="badge" style="display:none;"></div>
    <form id="orderForm">
      <label>আপনার নাম</label>
      <input type="text" id="customerName" required />

      <label>WhatsApp নম্বর</label>
      <input type="text" id="customerPhone" required />

      <label>প্যানেল সিলেক্ট করুন</label>
      <select id="panelSelect">
        <option value="Basic Panel - 500 BDT">Basic Panel - 500 BDT</option>
        <option value="Pro Panel - 1200 BDT">Pro Panel - 1200 BDT</option>
      </select>

      <button type="submit">অর্ডার কনফার্ম করুন</button>
    </form>
    <p id="msg"></p>
  </div>

  <script>
    // URL থেকে ?ref= বা ?reseller= কোড ধরে localStorage-এ সংরক্ষণ
    const params = new URLSearchParams(window.location.search);
    const refFromUrl = (params.get("ref") || params.get("reseller") || "").trim();
    if (refFromUrl) {
      localStorage.setItem("mazed_ref_code", refFromUrl);
    }

    const activeRef = localStorage.getItem("mazed_ref_code") || "";
    if (activeRef) {
      const badge = document.getElementById("refStatus");
      badge.style.display = "inline-block";
      badge.textContent = "রিসেলার কোড সক্রিয়: " + activeRef;
    }

    document.getElementById("orderForm").addEventListener("submit", function (e) {
      e.preventDefault();
      const orders = JSON.parse(localStorage.getItem("mazed_orders") || "[]");
      const newOrder = {
        id: "ORD-" + Date.now(),
        name: document.getElementById("customerName").value.trim(),
        phone: document.getElementById("customerPhone").value.trim(),
        panel: document.getElementById("panelSelect").value,
        resellerCode: activeRef || "DIRECT",
        status: "Pending",
        createdAt: new Date().toLocaleString()
      };
      orders.push(newOrder);
      localStorage.setItem("mazed_orders", JSON.stringify(orders));
      document.getElementById("msg").textContent = "অর্ডার রিসিভ হয়েছে! রেফারেল কোড: " + newOrder.resellerCode;
      this.reset();
    });
  </script>
</body>
</html>
